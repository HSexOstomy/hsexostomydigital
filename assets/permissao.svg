<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1220 520" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#537f84"/></marker><style>text{font-family:Arial,Helvetica,sans-serif;fill:#173d57}.title{font-size:27px;font-weight:700}.subtitle{font-size:15px;fill:#557482}.label{font-size:16px;font-weight:700}.tiny{font-size:12px}.note{font-size:13px;fill:#456e72}.white{fill:white}path.flow{fill:none;stroke:#6da49f;stroke-width:2.5;marker-end:url(#arrow)}.border{stroke:#94c6bd;stroke-width:2}.box{fill:white;stroke:#bedbd7;stroke-width:2}</style></defs><rect width="1220" height="520" rx="20" fill="#f7faf9"/><text x="610" y="49" text-anchor="middle" font-size="30" font-weight="bold" fill="#173d57">Como aplicar a Permissão</text><text x="610" y="75" text-anchor="middle" font-size="15" font-weight="normal" fill="#173d57">Figura 4, p. 30 · sequência de apoio ao encontro terapêutico</text><circle cx="140" cy="181" r="46" fill="#d8f1e6" stroke="#86c9bb" stroke-width="2"/><text x="140" y="193" text-anchor="middle" font-size="34" font-weight="bold" fill="#173d57">1</text><path class="flow" d="M189 181 H322"/><rect x="35" y="259" width="210" height="95" rx="14" fill="#eff8f2" stroke="#a5cdc2" stroke-width="2"/><text x="140" y="293" text-anchor="middle" font-size="18" font-weight="bold" fill="#173d57">Preparar o ambiente</text><text x="140" y="319" text-anchor="middle" font-size="13" font-weight="normal" fill="#173d57">Privacidade e acolhimento</text><circle cx="375" cy="181" r="46" fill="#c6edf0" stroke="#86c9bb" stroke-width="2"/><text x="375" y="193" text-anchor="middle" font-size="34" font-weight="bold" fill="#173d57">2</text><path class="flow" d="M424 181 H557"/><rect x="270" y="259" width="210" height="95" rx="14" fill="#e9f6f6" stroke="#a5cdc2" stroke-width="2"/><text x="375" y="293" text-anchor="middle" font-size="18" font-weight="bold" fill="#173d57">Solicitar Permissão</text><text x="375" y="319" text-anchor="middle" font-size="13" font-weight="normal" fill="#173d57">Explicar e pedir autorização</text><circle cx="610" cy="181" r="46" fill="#d8f1e6" stroke="#86c9bb" stroke-width="2"/><text x="610" y="193" text-anchor="middle" font-size="34" font-weight="bold" fill="#173d57">3</text><path class="flow" d="M659 181 H792"/><rect x="505" y="259" width="210" height="95" rx="14" fill="#eff8f2" stroke="#a5cdc2" stroke-width="2"/><text x="610" y="293" text-anchor="middle" font-size="18" font-weight="bold" fill="#173d57">Respeitar decisão</text><text x="610" y="319" text-anchor="middle" font-size="13" font-weight="normal" fill="#173d57">Ouvir sem pressionar</text><circle cx="845" cy="181" r="46" fill="#c6edf0" stroke="#86c9bb" stroke-width="2"/><text x="845" y="193" text-anchor="middle" font-size="34" font-weight="bold" fill="#173d57">4</text><path class="flow" d="M894 181 H1027"/><rect x="740" y="259" width="210" height="95" rx="14" fill="#e9f6f6" stroke="#a5cdc2" stroke-width="2"/><text x="845" y="293" text-anchor="middle" font-size="18" font-weight="bold" fill="#173d57">Iniciar diálogo</text><text x="845" y="319" text-anchor="middle" font-size="13" font-weight="normal" fill="#173d57">Escuta cuidadosa</text><circle cx="1080" cy="181" r="46" fill="#d8f1e6" stroke="#86c9bb" stroke-width="2"/><text x="1080" y="193" text-anchor="middle" font-size="34" font-weight="bold" fill="#173d57">5</text><rect x="975" y="259" width="210" height="95" rx="14" fill="#eff8f2" stroke="#a5cdc2" stroke-width="2"/><text x="1080" y="293" text-anchor="middle" font-size="18" font-weight="bold" fill="#173d57">Normalizar</text><text x="1080" y="319" text-anchor="middle" font-size="13" font-weight="normal" fill="#173d57">Sexualidade integra o cuidado</text><rect x="79" y="404" width="1065" height="84" rx="14" fill="#e6f6ec" stroke="#a5cdc2" stroke-width="2"/><text x="610" y="438" text-anchor="middle" font-size="19" font-weight="bold" fill="#173d57">A Permissão deve atravessar todos os encontros do programa.</text><text x="610" y="463" text-anchor="middle" font-size="14" font-weight="normal" fill="#173d57">A recusa deve ser acolhida; o cuidado geral e a possibilidade de retomada permanecem.</text></svg>