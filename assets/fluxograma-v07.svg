<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1160" role="img" aria-labelledby="title desc">
<title id="title">Fluxograma do H_Sex_Ostomy</title>
<desc id="desc">Admissão, Permissão, decisão sobre autorização, Informação Limitada, identificação de demandas, Sugestões Específicas, avaliação de suporte especializado, Terapia Intensiva se necessária e Revisão contínua. Caminhos Não mantêm acompanhamento.</desc>
<defs>
<marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8z" fill="#425b69"/></marker>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#07385d} .t{font-size:26px;font-weight:800}
.small{font-size:15px} .mid{font-size:19px;font-weight:700} .tiny{font-size:13px}
.box{stroke:#4e6570;stroke-width:1.5} .wire{fill:none;stroke:#425b69;stroke-width:2;marker-end:url(#arr)}
.alt{fill:none;stroke:#697780;stroke-width:1.8;stroke-dasharray:6 6;marker-end:url(#arr)}
.loop{fill:none;stroke:#15aa70;stroke-width:3;stroke-dasharray:7 6}
</style></defs>
<rect width="1000" height="1160" rx="14" fill="#f8faf9"/>
<text class="t" x="500" y="38" text-anchor="middle">Fluxo Integrado de Abordagem da Sexualidade</text>
<text class="mid" x="500" y="66" text-anchor="middle">do Homem com Estoma em Reabilitação</text>
<text class="small" x="500" y="91" text-anchor="middle">Esquema interativo baseado na Figura 3 · Manual, p. 28</text>
<ellipse class="box" cx="500" cy="141" rx="165" ry="32" fill="#4cc3f0"/>
<text class="mid" x="500" y="140" text-anchor="middle">Admissão no Programa</text>
<text class="tiny" x="500" y="159" text-anchor="middle">H_Sex_Ostomy</text>
<path class="wire" d="M500 174 V196"/>
<rect class="box" x="235" y="200" width="530" height="76" rx="12" fill="#19c28c"/>
<text class="mid" x="500" y="227" text-anchor="middle">Permissão</text>
<text class="small" x="500" y="248" text-anchor="middle">Solicitar consentimento em ambiente seguro</text>
<text class="tiny" x="500" y="265" text-anchor="middle">Respeitar autonomia, intimidade e limites</text>
<path class="wire" d="M500 277 V306"/>
<path d="M500 306 L650 356 L500 406 L350 356Z" fill="#ffd58f" stroke="#e5ba70" stroke-width="1.5"/>
<text class="mid" x="500" y="349" text-anchor="middle">Usuário autoriza</text>
<text class="mid" x="500" y="370" text-anchor="middle">a discussão?</text>
<path class="alt" d="M350 356 H170 V427"/>
<text x="297" y="346" class="small" fill="#9c4f5d" font-weight="700">NÃO</text>
<rect x="38" y="430" width="266" height="71" rx="3" fill="#dedede" stroke="#64717a" stroke-dasharray="5 4"/>
<text x="171" y="457" text-anchor="middle" class="small" font-weight="700">Continuar cuidado geral</text>
<text x="171" y="481" text-anchor="middle" class="tiny">Disponibilidade futura para diálogo</text>
<path class="wire" d="M500 406 V435"/><text x="516" y="422" class="small" fill="#08774c">SIM</text>
<rect class="box" x="235" y="439" width="530" height="92" rx="12" fill="#fff0cb"/>
<text class="mid" x="500" y="468" text-anchor="middle">Informação Limitada</text>
<text class="small" x="500" y="492" text-anchor="middle">Imagem corporal, intimidade, adaptação ao estoma</text>
<text class="small" x="500" y="515" text-anchor="middle">dúvidas, mitos e possíveis disfunções sexuais</text>
<path class="wire" d="M500 532 V551"/>
<path d="M500 551 L650 599 L500 647 L350 599 Z" fill="#ffd58f" stroke="#e5ba70" stroke-width="1.5"/>
<text x="500" y="604" text-anchor="middle" class="mid">Demandas específicas?</text>
<path class="alt" d="M350 599 H169 V669"/>
<text x="290" y="585" class="small" font-weight="700">NÃO</text>
<rect x="38" y="671" width="266" height="73" fill="#dedede" stroke="#64717a" stroke-dasharray="5 4"/>
<text x="171" y="698" text-anchor="middle" class="small" font-weight="700">Continuar acompanhamento</text>
<text x="171" y="721" text-anchor="middle" class="tiny">Informar disponibilidade futura</text>
<path class="wire" d="M500 647 V672"/><text x="516" y="661" class="small">SIM</text>
<rect class="box" x="235" y="676" width="530" height="90" rx="12" fill="#dfa9ee"/>
<text class="mid" x="500" y="706" text-anchor="middle">Sugestões Específicas</text>
<text x="500" y="728" text-anchor="middle" class="small">Avaliação clínica e histórico sexual</text>
<text x="500" y="751" text-anchor="middle" class="small">Intervenções de enfermagem individualizadas</text>
<path class="wire" d="M500 768 V786"/>
<path d="M500 787 L650 840 L500 893 L350 840Z" fill="#ffd58f" stroke="#e5ba70" stroke-width="1.5"/>
<text x="500" y="836" text-anchor="middle" class="mid">Necessita de suporte</text>
<text x="500" y="860" text-anchor="middle" class="mid">especializado?</text>
<path class="wire" d="M650 840 H725"/><text x="672" y="822" class="small">SIM</text>
<rect class="box" x="729" y="800" width="234" height="91" rx="11" fill="#e7b0ed"/>
<text x="845" y="835" class="mid" text-anchor="middle">Terapia Intensiva</text>
<text x="845" y="856" class="tiny" text-anchor="middle">Encaminhar conforme</text>
<text x="845" y="876" class="tiny" text-anchor="middle">necessidade e acompanhar</text>
<path class="wire" d="M500 894 V940"/><text x="515" y="920" class="small">NÃO</text>
<rect class="box" x="235" y="944" width="530" height="90" rx="12" fill="#19c28c"/>
<text x="500" y="974" text-anchor="middle" class="mid">Avaliação / Revisão / Reflexão</text>
<text x="500" y="998" text-anchor="middle" class="small">Monitorar mudanças e novas demandas</text>
<text x="500" y="1018" text-anchor="middle" class="tiny">Acompanhamento longitudinal ajustável</text>
<path class="alt" d="M171 502 V928 Q171 989 234 990"/>
<path class="alt" d="M171 744 V939 Q171 986 234 986"/>
<path class="alt" d="M845 891 V916 Q845 989 767 988"/>
<path class="loop" d="M765 240 H868 Q918 240 918 288 V1072 Q918 1098 890 1098 H519"/>
<path class="loop" d="M765 990 H858"/>
<circle cx="886" cy="240" r="25" fill="#19c28c" stroke="#087d58"/><text x="886" y="246" class="small" text-anchor="middle">loop</text>
<circle cx="500" cy="1098" r="25" fill="#19c28c" stroke="#087d58"/><text x="500" y="1104" class="small" text-anchor="middle">loop</text>
<text x="500" y="1143" class="tiny" text-anchor="middle">Permissão e Revisão são contínuas; etapas podem ser retomadas conforme as necessidades.</text>
</svg>