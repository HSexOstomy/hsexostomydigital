# Painel de edição do H_Sex_Ostomy Digital (Pages CMS: https://app.pagescms.org)
# Cada item abaixo vira um menu no painel. Os dados ficam na pasta conteudo/.
# O visual, as abas, as escalas e o conteúdo técnico do manual NÃO são editados por aqui.

media:
- name: imagens
  label: Fotos e logos
  input: assets/img
  output: assets/img
  rename: safe
  categories:
  - image
- name: documentos
  label: Documentos e arquivos
  input: assets/docs
  output: assets/docs
  rename: safe
  categories:
  - document
  - spreadsheet
  - compressed
  - image
content:
- name: pessoas-e-parceiros
  label: Equipe e parceiros
  type: group
  items:
  - name: equipe
    label: Equipe, bolsistas e colaboradores
    type: file
    path: conteudo/equipe.json
    format: json
    fields:
    - name: pessoas
      label: Pessoas
      description: Aparecem na página Sobre > Equipe, na ordem desta lista. Arraste para reordenar.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{nome}: {papel}'
      fields:
      - name: grupo
        label: Onde aparece
        type: select
        required: true
        options:
          values:
          - name: principal
            label: Equipe principal (autoria e orientação)
          - name: bolsistas
            label: Bolsistas
          - name: colaboradores
            label: Colaboradores(as)
      - name: nome
        label: Nome completo
        type: string
        required: true
      - name: papel
        label: Função no projeto
        description: 'Ex.: Coorientação; Bolsista de Iniciação Científica (PIBIC/CNPq); Revisão técnica'
        type: string
      - name: titulacao
        label: Formação e instituição
        description: 'Ex.: Enfermeira. Mestranda em Enfermagem (PPGENF/UFBA)'
        type: string
      - name: foto
        label: Foto
        description: 'Opcional. Qualquer tamanho: o site recorta automaticamente dentro do círculo. Prefira fotos leves (até 1 MB). Sem foto, aparecem as iniciais.'
        type: image
        options:
          media: imagens
      - name: enquadramento
        label: Enquadramento da foto no círculo
        description: Se o rosto ficar cortado, escolha onde ele está na foto.
        type: select
        options:
          values:
          - name: centro
            label: Rosto no centro da foto
          - name: alto
            label: Rosto na parte de cima da foto
          - name: baixo
            label: Rosto na parte de baixo da foto
      - name: bio
        label: Minibiografia
        type: text
      - name: link
        label: Link do currículo (Lattes, ORCID ou outro)
        description: Opcional. Começa com https://
        type: string
    - name: fichaTecnica
      label: Ficha técnica do manual
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{item}'
      fields:
      - name: item
        label: Item
        type: string
      - name: valor
        label: Texto
        type: text
  - name: instituicoes
    label: Instituições e apoio
    type: file
    path: conteudo/instituicoes.json
    format: json
    fields:
    - name: realizacao
      label: Realização (rodapé, Equipe e capa da apresentação)
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{nome}'
      fields:
      - name: nome
        label: Nome
        type: string
        required: true
      - name: logo
        label: Logo
        description: Opcional. PNG ou WebP com fundo transparente. Sem logo, aparece o nome.
        type: image
        options:
          media: imagens
      - name: url
        label: Site
        description: Opcional. Começa com https://
        type: string
    - name: apoio
      label: Apoio e financiamento
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{nome}'
      fields:
      - name: nome
        label: Nome
        type: string
        required: true
      - name: logo
        label: Logo
        description: Opcional. PNG ou WebP com fundo transparente. Sem logo, aparece o nome.
        type: image
        options:
          media: imagens
      - name: url
        label: Site
        description: Opcional. Começa com https://
        type: string
- name: textos
  label: Textos do site
  type: group
  items:
  - name: inicio
    label: Página inicial
    type: file
    path: conteudo/inicio.json
    format: json
    fields:
    - name: hero
      label: Abertura
      type: object
      fields:
      - name: kicker
        label: Linha acima do título
        type: string
      - name: titulo
        label: Título
        description: 'A palavra entre asteriscos fica em destaque. Ex.: A sexualidade também faz parte da *reabilitação*.'
        type: string
      - name: texto
        label: Texto de apresentação
        type: text
      - name: numeros
        label: Números em destaque
        type: object
        list:
          max: 4
          collapsible: false
        fields:
        - name: numero
          label: Número
          type: string
        - name: rotulo
          label: Descrição
          type: string
    - name: aviso
      label: Aviso em destaque (opcional)
      description: Faixa logo abaixo da abertura. Só aparece se tiver título; apague o título para esconder.
      type: object
      fields:
      - name: kicker
        label: Linha acima do título
        type: string
      - name: titulo
        label: Título
        type: string
      - name: texto
        label: Texto
        type: text
      - name: botaoTexto
        label: Texto do botão (opcional)
        type: string
      - name: botaoLink
        label: Link do botão
        description: 'Página do site (ex.: #workshop) ou endereço completo (https://...)'
        type: string
    - name: atalhos
      label: Cartões de atalho
      type: object
      fields:
      - name: consulta
        label: Cartão 1 (Na consulta)
        type: object
        fields:
        - name: titulo
          label: Título
          type: string
        - name: texto
          label: Texto
          type: text
      - name: planejador
        label: Cartão 2 (Planejador)
        type: object
        fields:
        - name: titulo
          label: Título
          type: string
        - name: texto
          label: Texto
          type: text
      - name: manual
        label: Cartão 3 (Manual)
        type: object
        fields:
        - name: titulo
          label: Título
          type: string
        - name: texto
          label: Texto
          type: text
      - name: capacitacao
        label: Cartão 4 (Formação de Habilidades)
        type: object
        fields:
        - name: titulo
          label: Título
          type: string
        - name: texto
          label: Texto
          type: text
    - name: programa
      label: Seção "O programa"
      type: object
      fields:
      - name: kicker
        label: Linha acima do título
        type: string
      - name: titulo
        label: Título
        type: string
      - name: texto
        label: Texto
        type: text
    - name: pesquisa
      label: Seção "Da pesquisa à prática"
      type: object
      fields:
      - name: kicker
        label: Linha acima do título
        type: string
      - name: titulo
        label: Título
        type: string
      - name: texto
        label: Texto
        type: text
    - name: usos
      label: Cartões "Para estudar / atender / formar equipes"
      type: object
      fields:
      - name: estudar
        label: Para estudar
        type: object
        fields:
        - name: titulo
          label: Título
          type: string
        - name: texto
          label: Texto
          type: text
        - name: link
          label: Texto do link
          type: string
      - name: atender
        label: Para atender
        type: object
        fields:
        - name: titulo
          label: Título
          type: string
        - name: texto
          label: Texto
          type: text
        - name: link
          label: Texto do link
          type: string
      - name: formar
        label: Para formar equipes
        type: object
        fields:
        - name: titulo
          label: Título
          type: string
        - name: texto
          label: Texto
          type: text
        - name: link
          label: Texto do link
          type: string
    - name: workshop
      label: Faixa do workshop (aparece até o fim do evento)
      type: object
      fields:
      - name: kicker
        label: Linha acima do título
        type: string
      - name: texto
        label: Texto
        type: text
  - name: sobre
    label: Sobre o programa
    type: file
    path: conteudo/sobre.json
    format: json
    fields:
    - name: lead
      label: Texto abaixo do título
      type: text
    - name: apresentacao
      label: Apresentação (parágrafos)
      description: Também aparece na seção Apresentação do leitor do manual.
      type: text
      list: true
    - name: finalidade
      label: Finalidade
      type: text
    - name: missao
      label: Missão
      type: text
    - name: visao
      label: Visão
      type: text
    - name: valores
      label: Valores
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{titulo}'
      fields:
      - name: titulo
        label: Título
        type: string
      - name: texto
        label: Texto
        type: text
    - name: publico
      label: Público-alvo
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{titulo}'
      fields:
      - name: titulo
        label: Título
        type: string
      - name: texto
        label: Texto
        type: text
    - name: percurso
      label: Percurso de construção (etapas)
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{titulo}'
      fields:
      - name: titulo
        label: Título
        type: string
      - name: texto
        label: Texto
        type: text
  - name: paginas
    label: Textos de abertura das páginas
    type: file
    path: conteudo/paginas.json
    format: json
    fields:
    - name: paginas
      label: Páginas
      description: O texto que aparece logo abaixo do título de cada página. Se apagar, volta o texto original.
      type: object
      list:
        min: 0
        collapsible:
          collapsed: true
          summary: '{titulo}'
      fields:
      - name: titulo
        label: Página
        type: string
        readonly: true
      - name: texto
        label: Texto de abertura
        type: text
  - name: orientacoes
    label: Folheto de orientações ao paciente
    type: file
    path: conteudo/orientacoes.json
    format: json
    fields:
    - name: titulo
      label: Título do folheto
      type: string
    - name: subtitulo
      label: Subtítulo
      type: text
    - name: rodape
      label: Frase final
      type: text
    - name: contatoServico
      label: Contato do serviço (opcional)
      description: 'Ex.: Ambulatório de Estomaterapia, (71) 0000-0000. Aparece no final do folheto impresso.'
      type: text
  - name: geral
    label: Contato e rodapé
    type: file
    path: conteudo/geral.json
    format: json
    fields:
    - name: contato
      label: Contato
      type: object
      fields:
      - name: email
        label: E-mail de contato
        type: string
      - name: cepTelefone
        label: Telefone do Comitê de Ética
        type: string
      - name: cepEmail
        label: E-mail do Comitê de Ética
        type: string
    - name: versao
      label: Versão exibida no rodapé
      type: string
    - name: rodapeDescricao
      label: 'Rodapé: frase abaixo do nome do programa'
      type: text
    - name: rodapeAviso
      label: 'Rodapé: aviso legal'
      description: O texto entre asteriscos fica em itálico.
      type: text
- name: manual
  label: Manual (PDF, capa e edição)
  type: file
  path: conteudo/manual.json
  format: json
  fields:
  - name: pdfArquivo
    label: PDF do manual (enviar arquivo)
    description: Quando preenchido, aparece o botão Baixar PDF na página do Manual, depois de Começar a leitura e Síntese de bolso.
    type: file
    options:
      media: documentos
  - name: pdfLink
    label: Ou link externo do PDF (Google Drive, OneDrive)
    description: Se preenchido, tem prioridade sobre o arquivo enviado. Começa com https://
    type: string
  - name: capa
    label: Capa do manual
    description: Aparece na página do Manual e em Sobre > O projeto. Prefira imagem vertical.
    type: image
    options:
      media: imagens
  - name: titulo
    label: Título do manual
    type: string
  - name: edicao
    label: Edição, ano e páginas
    description: 'Ex.: 1ª edição · 2026 · 75 páginas'
    type: string
  - name: autoria
    label: Autoria (linha abaixo do título)
    type: string
  - name: materiais
    label: Outros botões de download na página do Manual
    description: Para materiais ligados ao manual. Arquivos gerais do grupo ficam em Interação > Documentos.
    type: object
    list:
      collapsible:
        collapsed: true
        summary: '{titulo}'
    fields:
    - name: titulo
      label: Nome do botão
      type: string
    - name: arquivo
      label: Arquivo
      type: file
      options:
        media: documentos
    - name: link
      label: Ou link externo
      description: Se preenchido, tem prioridade sobre o arquivo.
      type: string
- name: interacao
  label: Interação
  type: group
  items:
  - name: eventos
    label: Registros de eventos
    type: file
    path: conteudo/eventos.json
    format: json
    fields:
    - name: eventos
      label: Eventos realizados
      description: Os mais recentes aparecem primeiro (pela data). Cada evento ganha uma página própria com caixa de comentários.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{titulo} ({data})'
      fields:
      - name: titulo
        label: Título do evento
        type: string
        required: true
      - name: data
        label: Data
        type: date
      - name: horario
        label: Horário
        description: 'Ex.: 14h às 17h'
        type: string
      - name: modalidade
        label: Modalidade
        type: select
        options:
          values:
          - name: presencial
            label: Presencial
          - name: online
            label: On-line
          - name: hibrido
            label: Híbrido
      - name: local
        label: Local
        description: 'Ex.: Escola de Enfermagem da UFBA, Salvador'
        type: string
      - name: publico
        label: Público
        description: 'Ex.: Enfermeiros(as) da atenção especializada'
        type: string
      - name: resumo
        label: Resumo (aparece no cartão e abaixo do título)
        type: text
      - name: capa
        label: Foto de capa
        description: Qualquer tamanho; o site recorta no formato do cartão.
        type: image
        options:
          media: imagens
          path: assets/img/eventos
      - name: texto
        label: Relato do evento
        description: 'Use os botões de formatação: negrito, listas, links e imagens.'
        type: rich-text
        options:
          format: html
          media: imagens
          path: assets/img/eventos
      - name: galeria
        label: Galeria de fotos
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{legenda}'
        fields:
        - name: imagem
          label: Foto
          type: image
          options:
            media: imagens
            path: assets/img/eventos
        - name: legenda
          label: Legenda (opcional)
          type: string
      - name: links
        label: Materiais e links
        description: Slides, gravação, fotos no Drive, formulários etc.
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{rotulo}'
        fields:
        - name: rotulo
          label: Texto do botão
          type: string
        - name: url
          label: Link ou arquivo
          description: Link completo (https://...) ou caminho de um arquivo enviado em Documentos.
          type: string
      - name: comentarios
        label: Aceitar comentários neste evento
        type: boolean
        default: true
  - name: noticias
    label: Notícias
    type: file
    path: conteudo/noticias.json
    format: json
    fields:
    - name: noticias
      label: Notícias e avisos
      description: Os destaques aparecem primeiro; depois, as mais recentes.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{titulo} ({data})'
      fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: data
        label: Data
        type: date
      - name: categoria
        label: Categoria
        type: select
        options:
          values:
          - name: noticia
            label: Notícia
          - name: aviso
            label: Aviso
          - name: publicacao
            label: Publicação
          - name: evento
            label: Evento
          - name: conquista
            label: Conquista
      - name: resumo
        label: Resumo (aparece na lista)
        type: text
      - name: imagem
        label: Imagem (opcional)
        type: image
        options:
          media: imagens
          path: assets/img/noticias
      - name: texto
        label: Texto completo
        type: rich-text
        options:
          format: html
          media: imagens
          path: assets/img/noticias
      - name: linkTexto
        label: Texto do botão (opcional)
        description: 'Ex.: Inscreva-se, Ler o artigo'
        type: string
      - name: linkUrl
        label: Link do botão
        description: 'Página do site (ex.: #workshop) ou endereço completo (https://...)'
        type: string
      - name: destaque
        label: Fixar no topo
        type: boolean
  - name: documentos
    label: Documentos
    type: file
    path: conteudo/documentos.json
    format: json
    fields:
    - name: documentos
      label: Arquivos disponíveis
      description: Envie o arquivo ou cole um link. A busca e os filtros aparecem sozinhos quando houver mais de três documentos.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{titulo}'
      fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: descricao
        label: Descrição (opcional)
        type: text
      - name: categoria
        label: Categoria
        type: select
        options:
          values:
          - name: manual
            label: Manuais e guias
          - name: artigo
            label: Artigos e publicações
          - name: apresentacao
            label: Apresentações
          - name: formulario
            label: Formulários e instrumentos
          - name: educativo
            label: Materiais educativos
          - name: outro
            label: Outros
      - name: arquivo
        label: Arquivo (PDF, Word, PowerPoint, Excel, ZIP)
        type: file
        options:
          media: documentos
      - name: link
        label: Ou link externo
        description: Se preenchido, tem prioridade sobre o arquivo.
        type: string
      - name: data
        label: Data (opcional)
        type: date
  - name: interacao-config
    label: Comentários (e-mail de destino)
    type: file
    path: conteudo/interacao.json
    format: json
    fields:
    - name: emailComentarios
      label: E-mail que recebe os comentários
      description: Na primeira vez que alguém comentar, esse e-mail recebe um pedido de ativação (FormSubmit). Clique em Activate Form para começar a receber.
      type: string
    - name: comentariosAtivos
      label: Caixa de comentários ativa nos eventos
      type: boolean
    - name: avisoComentarios
      label: Aviso acima da caixa de comentários
      type: text
    - name: mensagemSucesso
      label: Mensagem depois de enviar
      type: string
- name: workshop
  label: Workshop
  type: group
  items:
  - name: workshop-dados
    label: Data, links e roteiro
    type: file
    path: conteudo/workshop.json
    format: json
    fields:
    - name: data
      label: Data
      type: date
    - name: horario
      label: Horário de início
      description: Formato 19:00
      type: string
    - name: duracaoMin
      label: Duração total (minutos)
      type: number
    - name: modalidade
      label: Modalidade
      type: string
    - name: linkMeet
      label: Link do Google Meet
      type: string
    - name: linkPreTeste
      label: Link do pré-teste (Google Forms)
      type: string
    - name: linkPosTeste
      label: Link do pós-teste (Google Forms)
      description: Gera o QR code do último slide.
      type: string
    - name: linkMural
      label: Link do mural de opiniões (Padlet ou Mentimeter)
      description: Quando preenchido, aparece um botão na área do participante e o QR code no slide da discussão. Sem link, nada aparece.
      type: string
    - name: muralTitulo
      label: Nome do mural
      type: string
    - name: muralTexto
      label: Convite para participar do mural
      type: text
    - name: enderecoSite
      label: Endereço do site (QR code do modo participante)
      type: string
    - name: agenda
      label: Roteiro (blocos)
      description: Edite título, duração e objetivo. Os horários são recalculados sozinhos.
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{index}. {titulo} ({min} min)'
      fields:
      - name: id
        label: Código interno
        description: Não altere.
        type: string
        readonly: true
      - name: titulo
        label: Título
        type: string
      - name: min
        label: Duração (minutos)
        type: number
      - name: objetivo
        label: Objetivo
        type: text
    - name: checklistAntes
      label: Checklist da equipe (antes do encontro)
      type: string
      list: true
    - name: checklistCuidado
      label: Alerta sobre o pré-teste
      type: text
    - name: discussao
      label: Eixos da discussão participativa
      type: object
      list:
        collapsible:
          collapsed: true
          summary: '{eixo}'
      fields:
      - name: eixo
        label: Eixo
        type: string
      - name: pergunta
        label: Pergunta disparadora
        type: text
      - name: apoio
        label: Orientação para quem conduz
        type: text
  - name: slides
    label: Slides da apresentação
    type: file
    path: conteudo/slides.json
    format: json
    fields:
    - name: slides
      label: Slides
      description: Edite títulos, tópicos e notas. O tipo de cada slide e as figuras são fixos.
      type: object
      list:
        min: 1
        collapsible:
          collapsed: true
          summary: '{index}. {titulo}'
      fields:
      - name: tipo
        label: Tipo de slide
        description: Fixo. Slides novos entram como lista de tópicos.
        type: string
        readonly: true
      - name: bloco
        label: Bloco do roteiro
        description: Não altere.
        type: string
        readonly: true
      - name: kicker
        label: Linha acima do título
        type: string
      - name: titulo
        label: Título (no slide de citação, é a própria citação)
        type: text
      - name: sub
        label: Subtítulo (só na capa)
        type: string
      - name: texto
        label: Texto (atividades, pausa, encerramento e nota do percurso)
        type: text
      - name: pontos
        label: Tópicos (slides de tópicos)
        type: string
        list: true
